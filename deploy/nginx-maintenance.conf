# deploy/nginx-maintenance.conf
#
# LA PAGE "ON BOSSE SUR UN TRUC" PENDANT UN DEPLOIEMENT.
#
# Bene, 26 aout 2026 : "on peut mettre une page fixe qui dit oups on est
# en train de bosser sur un petit quelque chose, actualise la page d'ici
# 5mn et ca devrait etre ok".
#
# -- POURQUOI CA NE PEUT PAS ETRE UNE PAGE DE L'APP --------------------
#
# Pendant le deploiement, c'est l'APP qui est indisponible : une page
# Next ne peut pas s'afficher, puisque c'est justement le serveur qui ne
# repond pas (ou qui repond mal). La page doit donc etre servie par
# nginx, en amont, a partir d'un fichier statique.
#
# -- LES DEUX MOMENTS COUVERTS, ET ILS SONT DIFFERENTS ------------------
#
#   1. `npm run build` ecrit dans `.next` PENDANT que l'ancien processus
#      sert encore. Une page demandee a cet instant peut chercher un
#      morceau de code que le build vient de remplacer -> 500, et c'est
#      le processus qui repond, pas nginx.
#   2. `pm2 restart` coupe le processus quelques secondes -> nginx ne
#      trouve plus personne au bout du proxy -> 502.
#
# On intercepte donc 500 ET 502/503/504. Couvrir un seul des deux laisse
# la moitie de la fenetre a decouvert.
#
# -- CE QU'ON N'INTERCEPTE JAMAIS : /api/ -------------------------------
#
# Un webhook Stripe, PayPal ou Systeme.io doit recevoir son VRAI code.
# Lui rendre une page HTML en 200 lui ferait croire que tout s'est bien
# passe, donc il ne reessaierait JAMAIS : une vente encaissee sans acces
# ouvert, en silence. C'est exactement le bug du 24 aout, et il ne se
# voit qu'a la reclamation du client.
#
# -- LE CODE DE STATUT EST CONSERVE -------------------------------------
#
# Pas de `=` apres `error_page` : la reponse garde son 5xx. Une page de
# maintenance servie en 200 finit indexee par Google a la place de la
# vraie page.
#
# -- ET LE REVERS, A ASSUMER --------------------------------------------
#
# Une VRAIE panne de l'app affichera desormais cette page au lieu d'un
# message d'erreur. C'est mieux pour le visiteur, et c'est pire pour le
# diagnostic : l'erreur ne se voit plus dans le navigateur. Elle reste
# entiere dans `pm2 logs <app> --lines 100`, et c'est LA qu'on regarde
# maintenant. Un journal se lit, il ne se deduit pas.

# --- A POSER UNE FOIS SUR LE SERVEUR ---------------------------------
#   sudo mkdir -p /var/www/maintenance
#   sudo cp /home/tipote/tipote-app/deploy/maintenance.html /var/www/maintenance/
#   sudo cp /home/tipote/tiquiz-app/deploy/maintenance.html /var/www/maintenance/
#   (le meme fichier dans les deux depots : une seule page pour les deux)
#
# Puis, DANS le bloc `server { ... }` de chaque site :

    # Les routes d'API passent en direct, sans filet. Voir plus haut.
    location /api/ {
        proxy_pass          http://127.0.0.1:3000;   # 3001 pour l'autre app
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";
    }

    location / {
        proxy_pass          http://127.0.0.1:3000;   # 3001 pour l'autre app
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";

        # Sans cette ligne, nginx rend telle quelle l'erreur du serveur
        # applicatif et les `error_page` ci-dessous ne servent a rien.
        proxy_intercept_errors on;
        error_page 500 502 503 504 @maintenance;
    }

    location @maintenance {
        root /var/www/maintenance;
        rewrite ^ /maintenance.html break;
        add_header Cache-Control "no-store" always;
        internal;
    }

# --- VERIFIER AVANT DE RECHARGER --------------------------------------
#   sudo nginx -t && sudo systemctl reload nginx
#
# Le `&&` n'est pas cosmetique : un `reload` sur une conf invalide met le
# site par terre, et c'est exactement ce qu'on essaie d'eviter.
