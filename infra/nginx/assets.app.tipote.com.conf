# Fichiers publics (images de quiz) servis par CE serveur.
#
# Bene, 26 aout 2026 : "on a un super serveur quasiment inutilise : on ne
# peut pas l'exploiter davantage ? Histoire de ne pas avoir un abonnement
# en plus a payer et d'eviter les futures alertes, sur toutes les app ?"
#
# Le stockage Supabase est a 73 % du plan gratuit. Ce serveur est a 47 Go
# sur 400, 1 % de CPU, 0,1 To de bande passante sur 32.
#
# -- POURQUOI C'EST PLUS SIMPLE QUE LES VIDEOS -------------------------
#
# `videos.*.conf` protege ses fichiers par `secure_link` : une video est
# reservee aux eleves, donc son URL expire. Ici c'est l'inverse : ces
# images sont deja PUBLIQUES, affichees sur des pages de quiz ouvertes a
# tous et partagees sur les reseaux. Une URL qui expire casserait
# l'apercu d'un partage Facebook trois jours plus tard.
#
# Donc : pas de signature, pas d'expiration, et un cache LONG. Le nom du
# fichier porte deja l'horodatage de l'envoi (`<quiz>-1756123456789.webp`),
# donc une image remplacee a une adresse neuve : on peut mettre en cache
# un an sans jamais servir une version perimee.
#
# -- CE QUI EST INTERDIT ICI -------------------------------------------
#
# Aucune execution : ces fichiers viennent du televersement d'une
# cliente. `default_type` force le telechargement de tout ce qu'on ne
# reconnait pas plutot que de le laisser interpreter par le navigateur.

server {
    listen 80;
    listen [::]:80;
    server_name assets.app.tipote.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name assets.app.tipote.com;

    ssl_certificate     /etc/letsencrypt/live/assets.app.tipote.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assets.app.tipote.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    sendfile on;
    tcp_nopush on;

    root /srv/assets-tipote;

    # Une image ne pese jamais 50 Mo : ce qui deborde n'a rien a faire la.
    client_max_body_size 1m;

    # Rien qui commence par un point, rien qui puisse s'executer.
    location ~ /\.            { deny all; }
    location ~* \.(php|phtml|pl|py|cgi|sh|html?|svg|xml)$ { deny all; }

    location / {
        # Le nom du fichier porte l'horodatage de l'envoi : une adresse
        # ne designe donc jamais deux contenus differents.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Une image affichee dans un <img> n'a pas besoin de CORS, mais
        # le studio visuel la relit dans un <canvas> : sans cet en-tete,
        # le canvas devient "tainted" et l'export echoue.
        add_header Access-Control-Allow-Origin "*" always;

        # Ce qu'on ne reconnait pas se telecharge au lieu de s'afficher.
        default_type application/octet-stream;

        try_files $uri =404;
    }
}
